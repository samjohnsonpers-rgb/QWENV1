const DARK_OVR={bg:'#0A0A10',surface:'#131319',text:'#F2F2F7',muted:'#9CA0AE'};
function resolveTokens(d){
  const base=PALETTES[d.palette]||PALETTES['dark-premium'];
  const t={...base};
  const isLightBase=(base.bg[1]==='F'||base.bg[1]==='f');
  if(d.mode==='light'&&isLightBase) return {...t,border:'rgba(20,20,30,.10)'};
  if(d.mode==='light') return {...t,...LIGHT_OVR,border:'rgba(20,20,30,.10)'};
  if(d.mode==='dark'&&!isLightBase) return {...t,border:'rgba(255,255,255,.10)'};
  if(d.mode==='dark') return {...t,...DARK_OVR,border:'rgba(255,255,255,.10)'};
  return {...t,border:isLightBase?'rgba(20,20,30,.10)':'rgba(255,255,255,.10)'};
}

function hl(code,lang){
 const defs=DEFS[lang]||[];
 if(!defs.length)return esc(code);
 const master=new RegExp(defs.map(d=>'('+d[0].source+')').join('|'),'gm');
 let out='',last=0,m;
 while((m=master.exec(code))){
  out+=esc(code.slice(last,m.index));
  let gi=0;for(let i=1;i<m.length;i++){if(m[i]!==undefined){gi=i-1;break;}}
  out+='<span class="tk-'+defs[gi][1]+'">'+esc(m[0])+'</span>';
  last=m.index+m[0].length;
  if(m[0].length===0)master.lastIndex++;
 }
 return out+esc(code.slice(last));
}

function gem(stage,cat,payloadSize,outputSize,latency,status='success',note=''){
 const model=S.settings.routing[cat]||S.settings.routing.code;
 const tin=Math.round((payloadSize||300)/4)+140+Math.floor(Math.random()*80);
 const tout=Math.round((outputSize||200)/4)+60+Math.floor(Math.random()*40);
 S.telemetry.push({id:uid(),ts:Date.now(),stage,model,tin,tout,latency:Math.round(latency),status,note});
 if(S.telemetry.length>400)S.telemetry=S.telemetry.slice(-400);
 save();
}
const tokTotals=()=>{
 const t={tokens:0,tin:0,tout:0,calls:S.telemetry.length,cost:0,lat:0,err:0};
 S.telemetry.forEach(r=>{t.tokens+=r.tin+r.tout;t.tin+=r.tin;t.tout+=r.tout;t.lat+=r.latency;
  const m=MODELS[r.model]||MODELS['gemini-2.5-flash'];t.cost+=(r.tin*m.in+r.tout*m.out)/1e6;if(r.status!=='success')t.err++;});
 t.avgLat=t.calls?Math.round(t.lat/t.calls):0;return t;
};

function previewDoc(p){
 if(!p)return '';
 const files=p.files;
 const css=(files.find(f=>f.path.endsWith('.css'))||{content:''}).content;
 const idx=files.find(f=>f.path==='index.html');
 if(!idx)return '';
 let doc=idx.content.replace(/<link[^>]*rel="stylesheet"[^>]*>/i,'<style>'+css+'</style>');
 doc=doc.replace(/<script src="[^"]*"><\/script>/g,'');
 const scripts=files.filter(f=>f.path.endsWith('.js')).sort((a,b)=>a.order-b.order);
 const inline=scripts.map(s=>'<script>/* '+s.path+' */\n'+s.content+'\n</'+'script>').join('\n');
 doc=doc.replace('</body>',inline+'\n</body>');
 return doc;
}

function phaseIndex(){const s=S.pipeline.stage;
 if(s==='idle')return S.project?7:-1;
 if(s==='understanding')return 0;
 if(['clarifying','consolidating','brief'].includes(s))return 1;
 if(s==='design')return 2;
 if(['structure','roadmap'].includes(s))return 3;
 if(['executing','repairing'].includes(s))return 4;
 if(s==='validating')return 5;
 if(s==='completed')return 6;
 return 4;}

/* ═════════════════════════ PIPELINE ENGINE ═════════════════════════ */
function setStage(stage,status){S.pipeline.stage=stage;S.pipeline.status=status||'';updateLive();}
function updateLive(){
 if(S.view==='chat'){
  renderPanel();
  const sc=$('#msgScroll');
 }
}
function gate(){return new Promise(r=>{gateResolve=r;});}
function waitGate(kind){S.pipeline.waiting=kind;S.pipeline.running=false;render();return gate();}
function resolveGate(v){if(gateResolve){const r=gateResolve;gateResolve=null;r(v);}}
function act(kind,text,tone='ok'){S.activity.push({ts:Date.now(),icon:kind==='file'?IC.file:kind==='zap'?IC.zap:kind==='cpu'?IC.cpu:kind==='alert'?IC.alert:kind==='check'?IC.check:IC.spark,text,tone});if(S.activity.length>60)S.activity=S.activity.slice(-60);}
function term(text,cls='out'){S.terminal.push({text,cls});if(S.terminal.length>200)S.terminal=S.terminal.slice(-200);}

function finishStreams(){S.messages.forEach(m=>{if(m.streaming){m.streaming=false;m.text=m.full;}});if(streamTimer){clearInterval(streamTimer);streamTimer=null;}}
function pushMsg(m){finishStreams();S.messages.push(m);if(S.view==='chat'){ $('#msgList').insertAdjacentHTML('beforeend',messageHTML(m));const sc=$('#msgScroll');sc.scrollTop=sc.scrollHeight;} }
function streamText(full){
 return new Promise(res=>{
  const m={id:uid(),role:'agent',kind:'text',text:'',full,streaming:true};
  S.messages.push(m);
  if(S.view!=='chat'){m.text=full;m.streaming=false;res();return;}
  $('#msgList').insertAdjacentHTML('beforeend',messageHTML(m));
  const sc=$('#msgScroll');sc.scrollTop=sc.scrollHeight;
  let i=0;
  streamTimer=setInterval(()=>{
   if(aborted||S.view!=='chat'){m.text=full;m.streaming=false;clearInterval(streamTimer);streamTimer=null;render();res();return;}
   i=Math.min(full.length,i+3);m.text=full.slice(0,i);
   const el=$('#txt-'+m.id);
   if(el){el.innerHTML=esc(m.text)+(i<full.length?'<span class="caret"></span>':'');}
   sc.scrollTop=sc.scrollHeight;
   if(i>=full.length){m.streaming=false;clearInterval(streamTimer);streamTimer=null;res();}
  },18);
 });
}
async function step(ms,stage,status){setStage(stage,status);const t0=Date.now();await sleep(ms);return Date.now()-t0;}

function askQuestions(type){
 const feats={landing:['Feature highlights','Stats','Pricing','Testimonials','FAQ','CTA band'],dashboard:['KPI cards','Charts','Data table','Activity feed'],notes:['Note list','Editor','Search','Tags']};
 return [
  {id:'q1',q:"What's the primary goal?",why:'Shapes the brief and success criteria.',multi:false,options:['Launch a product','Attract customers','Showcase work','Internal tooling']},
  {id:'q2',q:'Which visual direction fits best?',why:'Drives the design pack.',multi:false,options:['Dark & premium','Minimal & light','Bold & vibrant','Warm & editorial']},
  {id:'q3',q:'What should be included?',why:'Pick what matters — the rest stays out.',multi:true,options:feats[type]},
  {id:'q4',q:'Who is this for?',why:'Tunes tone and content.',multi:false,options:['Consumers','Startups','Enterprise','Developers']},
 ];
}
function paletteFromAns(ans){
 const map={'Dark & premium':'dark-premium','Minimal & light':'minimal-light','Bold & vibrant':'bold-vibrant','Warm & editorial':'warm-editorial'};
 return map[ans.q2]||'dark-premium';
}

async function handleSend(){
 const ta=$('#composer');if(!ta)return;
 const text=ta.value.trim();
 if(!text||!canSend())return;
 ta.value='';ta.style.height='auto';
 pushMsg({id:uid(),role:'user',text});
 save();startRun(text);
}
async function startRun(text){
 const my=++runSeq;aborted=false;
 S.pipeline.running=true;render();
 try{
  if(!S.project)await newProjectFlow(text,my);
  else await followUpFlow(text,my);
 }catch(e){}
 finally{if(my===runSeq){S.pipeline.running=false;S.pipeline.waiting=null;if(S.pipeline.stage!=='completed'&&S.pipeline.stage!=='idle')S.pipeline.stage='idle';S.pipeline.status='';render();save();}}
}
function stopRun(){aborted=true;resolveGate(null);S.pipeline.running=false;S.pipeline.stage='idle';S.pipeline.status='';
 pushMsg({id:uid(),role:'agent',kind:'text',text:'Stopped. Everything completed so far is preserved — pick up whenever you are ready.'});
 act(IC.stop,'Run stopped by user','err');render();save();}

async function newProjectFlow(text,my){
 let ms=await step(900,'understanding','Understanding your request…');
 if(aborted)return;
 const type=detectType(text);
 gem('intent_classification','plan',text.length,120,ms,true==true?'success':'success','User message + session state');
 ms=await step(700,'clarifying','Preparing a few questions…');
 if(aborted)return;
 gem('clarification_generation','plan',420,640,ms,'success','Project type: '+type);
 S.clarifyAnswers={};
 const qmsg={id:uid(),role:'agent',kind:'clarify',questions:askQuestions(type),done:false};
 pushMsg(qmsg);
 const ans=await waitGate('clarify');
 if(aborted)return;
 qmsg.done=true;
 setStage('consolidating','Consolidating your answers…');
 await sleep(800);if(aborted)return;
 gem('vision_consolidation','plan',560,480,800,'success','Clarification answers');
 const brief=deriveBrief(text,type,S.clarifyAnswers);
 await streamText(`Got it. Here's my read on the goal:\n\nA ${brief.type==='landing'?'landing experience':brief.type} called ${brief.name} — ${brief.goal.toLowerCase()}, aimed at ${brief.audience.toLowerCase()}. I'll write the full brief, then propose a design direction before any code is written.`);
 setStage('brief','Writing project brief…');
 await sleep(950);if(aborted)return;
 gem('project_brief','plan',JSON.stringify(brief).length,900,950,'success','Consolidated vision brief');
 pushMsg({id:uid(),role:'agent',kind:'brief',brief});
 act(IC.book,'Project brief stored in memory');
 /* design */
 setStage('design','Creating design system…');
 await sleep(1150);if(aborted)return;
 let design={palette:paletteFromAns(ans),mode:'auto',radius:'14px',motion:'Smooth & subtle',fontPair:'Inter + JetBrains Mono'};
 gem('design_pack','code',820,1500,1150,'success','Brief + design answers');
 const dmsg={id:uid(),role:'agent',kind:'design',pack:{...design},status:'pending'};
 pushMsg(dmsg);
 while(true){
  const dec=await waitGate('design');
  if(aborted)return;
  if(dec==='regen'){
   const keys=Object.keys(PALETTES);design.palette=keys[(keys.indexOf(design.palette)+1)%keys.length];
   dmsg.pack={...design};render();
   setStage('design','Regenerating design direction…');
   await sleep(850);if(aborted)return;
   gem('design_pack_regen','code',780,1450,850,'success','Palette rotation → '+PALETTES[design.palette].label);
   toast('Design pack regenerated — '+PALETTES[design.palette].label,'info');
   continue;
  }
  break;
 }
 dmsg.status='approved';render();
 act(IC.palette,'Design pack approved — '+PALETTES[design.palette].label);
 /* structure + roadmap */
 ms=await step(1000,'structure','Determining the best project structure…');
 if(aborted)return;
 gem('architecture_decision','plan',900,760,ms,'success','Brief + design summary');
 await streamText(type==='landing'
  ?'Structure decision: Class B static build. Separated entry point, token-driven stylesheet, and section modules mounted by a bootstrap script — real multi-file organization without unnecessary tooling.'
  :type==='dashboard'?'Structure decision: app shell with a data layer separated from the render engine. KPIs, chart and table are all data-driven.'
  :'Structure decision: two-pane editor with a local persistence layer. Shell, styles and logic stay in separate files.');
 ms=await step(1000,'roadmap','Generating roadmap…');
 if(aborted)return;
 const tasks=buildRoadmap(type,brief);
 gem('roadmap_generation','plan',980,tasks.length*90,ms,'success','Structure plan + brief');
 const rmsg={id:uid(),role:'agent',kind:'roadmap',tasks:tasks.map(t=>({title:t.title,cat:t.cat})),status:'pending'};
 pushMsg(rmsg);
 if(S.settings.autonomy.approval){
  const ok=await waitGate('roadmap');
  if(aborted)return;
 }else{await sleep(600);if(aborted)return;}
 rmsg.status='approved';
 S.roadmap=tasks;
 /* create project */
 S.project={name:brief.name,type,brief,design,version:'v1.0',createdAt:Date.now(),files:[],pending:buildFiles(type,brief,design)};
 render();
 act(IC.rocket,brief.name+' created — scaffolding started');
 /* execute */
 let repairUsed=false;
 for(const task of tasks){
  if(aborted)return;
  task.status='active';
  setStage('executing',task.statusText);
  render();
  const t0=Date.now();
  await sleep(task.cat==='validate'?1200:650+Math.random()*550);
  const lat=Date.now()-t0;
  if(aborted)return;
  if(task.cat==='structure'&&task.title.includes('folder')){
   term('❯ mkdir -p styles scripts/sections assets','cmd');term('✓ directory structure created','ok');
  }
  /* failure injection once on logic task */
  if(task.cat==='logic'&&!repairUsed&&Math.random()<0.28){
   repairUsed=true;
   task.status='active';
   setStage('repairing','Detected an issue — diagnosing…');
   term('❯ node --check scripts/main.js','cmd');
   term('✗ SyntaxError: Unexpected token (main.js:4)','err');
   act(IC.alert,'Build failed: syntax error in bootstrap','err');
   gem('error_diagnosis','review',760,340,600,'error','Terminal log + failing file');
   render();
   await sleep(900);if(aborted)return;
   const rmsg2={id:uid(),role:'agent',kind:'repair',where:task.title,err:'SyntaxError: Unexpected token (main.js:4)',diagnosis:'a section module was concatenated without a closing quote.',fix:'regenerate the bootstrap with validated string joins.',status:'pending'};
   pushMsg(rmsg2);
   if(!S.settings.autonomy.autofix){
    const ok=await waitGate('repair');
    if(aborted)return;
   }
   rmsg2.status='applied';
   setStage('repairing','Applying targeted repair…');
   await sleep(850);if(aborted)return;
   term('✓ repair applied — main.js regenerated','ok');
   gem('repair_execution','code',680,900,850,'success','Diagnosis + file context');
   act(IC.check,'Repair validated — build continues');
   render();
  }
  /* produce files */
  task.files.forEach(p=>{
   const f=S.project.pending.find(x=>x.path===p);
   if(f){S.project.files.push({path:f.path,purpose:f.purpose,content:f.content,order:f.order,createdAt:Date.now(),modifiedAt:null});
    term('❯ write '+f.path,'cmd');term('✓ '+f.path+' ('+f.content.split('\n').length+' lines)','ok');
    act(IC.file,'Created '+f.path);}
  });
  if(task.cat==='validate'){
   term('❯ npm run build','cmd');term('✓ compiled successfully in '+(320+Math.floor(Math.random()*240))+'ms — 0 errors','ok');
   term('❯ preview handshake','cmd');term('✓ serving at preview.meridian.local','ok');
   gem('build_validation','review',540,220,lat,'success','Changed files + build output');
   S.previewOn=true;
   act(IC.check,'Build validated — preview enabled');
  }else{
   gem('task_execution_'+task.cat,'code',(task.files.length?S.project.pending.find(x=>x.path===task.files[0])?.content.length||800:400)+600,900,lat,'success',task.title);
  }
  task.status='done';
  setStage(task.cat==='validate'?'validating':'executing',task.statusText+' ✓');
  render();save();
 }
 /* completion */
 setStage('completed','Version 1.0 complete');
 const tt=tokTotals();
 const next={landing:['Switch to light mode','Try a vibrant palette','Add a testimonials section'],dashboard:['Switch to light mode','Try a vibrant palette','Refine the spacing'],notes:['Switch to dark mode','Try a warm palette','Add more contrast']}[type];
 pushMsg({id:uid(),role:'agent',kind:'completion',version:'1.0',summary:`${brief.name} is built, validated and live in the preview. ${S.project.files.length} files across a structured workspace — inspect any of them in the Workspace view.`,files:S.project.files.length,tasks:tasks.length,tokens:tt.tokens,next});
 S.timeline.push({id:uid(),ts:Date.now(),tag:'create',title:'Version 1.0 created',summary:`${brief.name} scaffolded, implemented and validated — ${S.project.files.length} files.`,detail:'Pipeline: brief → design pack → structure → roadmap → file-by-file build → validation.',files:S.project.files.map(f=>f.path)});
 act(IC.rocket,brief.name+' v1.0 shipped');
 toast('Project ready — preview is live','success');
 render();save();
}

async function followUpFlow(text,my){
 let ms=await step(800,'understanding','Analyzing change request…');
 if(aborted)return;
 gem('change_classification','plan',text.length+400,140,ms,'success','Existing project: '+S.project.name);
 const low=text.toLowerCase();
 let change='polish',desc='refinement pass';
 if(/dark/.test(low)&&/light/.test(low)===false||/dark mode/.test(low)){change='mode-dark';desc='switch to dark mode';}
 else if(/light mode|light theme/.test(low)){change='mode-light';desc='switch to light mode';}
 else if(/vibrant|bold/.test(low)){change='pal-bold-vibrant';desc='adopt a bold & vibrant palette';}
 else if(/warm|editorial/.test(low)){change='pal-warm-editorial';desc='adopt a warm & editorial palette';}
 else if(/minimal|clean|light/.test(low)){change='pal-minimal-light';desc='adopt a minimal & light palette';}
 else if(/premium|dark/.test(low)){change='pal-dark-premium';desc='adopt a dark & premium palette';}
 else if(/add|include|new section|extra/.test(low)){change='polish';desc='add new content';}
 const micro=[
  {id:uid(),title:'Analyze request against project memory',cat:'research',status:'active',statusText:'Reviewing project context…',files:[]},
  {id:uid(),title:'Apply change: '+desc,cat:'code',status:'pending',statusText:'Applying changes…',files:[]},
  {id:uid(),title:'Validate & refresh preview',cat:'validate',status:'pending',statusText:'Validating changes…',files:[]},
 ];
 S.roadmap=micro;render();
 await streamText(`This is a follow-up on ${S.project.name}, so I'll keep the existing brief and structure — only the affected files change. Applying: ${desc}.`);
 for(const t of micro){
  if(aborted)return;
  t.status='active';setStage('executing',t.statusText);render();
  const t0=Date.now();await sleep(750+Math.random()*500);const lat=Date.now()-t0;
  if(aborted)return;
  if(t.cat==='research'){gem('context_review','review',900,220,lat,'success','Brief + design pack + file map');}
  if(t.cat==='code'){
   if(change==='mode-dark')S.project.design.mode='dark';
   else if(change==='mode-light')S.project.design.mode='light';
   else if(change.startsWith('pal-')){S.project.design.palette=change.slice(4);S.project.design.mode='auto';}
   const rebuilt=buildFiles(S.project.type,S.project.brief,S.project.design);
   let n=0;
   rebuilt.forEach(nf=>{const ex=S.project.files.find(f=>f.path===nf.path);
    if(ex){if(ex.content!==nf.content){ex.content=nf.content;ex.modifiedAt=Date.now();n++;term('❯ update '+nf.path,'cmd');term('✓ '+nf.path+' regenerated','ok');}}
    else{S.project.files.push({...nf,createdAt:Date.now()});n++;term('❯ create '+nf.path,'cmd');term('✓ '+nf.path+' created','ok');}});
   act(IC.zap,n+' files updated — '+desc);
   gem('task_execution_modification','code',1400,n*600+300,lat,'success','Targeted edit with full project context');
   const v=S.project.version.match(/v(\d+)\.(\d+)/);S.project.version='v'+v[1]+'.'+(Number(v[2])+1);
  }
  if(t.cat==='validate'){term('❯ npm run build','cmd');term('✓ compiled successfully — 0 errors','ok');gem('revalidation','review',500,180,lat,'success','Changed files');S.previewOn=true;}
  t.status='done';render();save();
 }
 setStage('completed','Update applied');
 S.timeline.push({id:uid(),ts:Date.now(),tag:'update',title:'Update: '+desc,summary:`Follow-up request applied to ${S.project.name} (${S.project.version}). Existing brief and structure preserved.`,detail:'Lightweight pipeline: context review → targeted change → revalidation.',files:S.project.files.filter(f=>f.modifiedAt).map(f=>f.path)});
 pushMsg({id:uid(),role:'agent',kind:'text',text:`Done — ${desc} applied and revalidated. The preview is refreshed; open the Workspace to inspect the modified files (marked with a violet dot).`});
 toast('Changes applied — preview updated','success');
 render();save();
}

/* ═════════════════════════ GATEWAY ═════════════════════════ */
async function testGateway(){
 const url=($('#gwUrl')?.value||S.settings.backendUrl).trim();
 S.settings.backendUrl=url;
 if(!url){S.settings.gw='unconfigured';render();toast('Enter a backend gateway URL first.','warn');return;}
 S.settings.gw='checking';render();
 try{
  const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),7000);
  const res=await fetch(url.replace(/\/$/,'')+'/health',{signal:ctrl.signal});
  if(!res.ok)throw 0;
  const j=await res.json().catch(()=>({}));
  if(j&&j.ok===false)throw 0;
  S.settings.gw='connected';toast('Gateway connected — Render → Gemini bridge is live.','success');
  act(IC.plug,'Gateway connected: '+url);
 }catch(e){
  S.settings.gw='error';toast('Gateway unreachable. Verify the URL and that the Render service is running.','error');
 }
 render();save();
}

/* ═════════════════════════ ACTIONS ═════════════════════════ */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const d=el.dataset;
 switch(d.act){
  case 'nav':go(d.view);break;
  case 'goto-settings':go('settings');break;
  case 'send':handleSend();break;
  case 'stop':stopRun();break;
  case 'suggest':{const c=$('#composer');if(c){c.value=d.text;c.focus();}break;}
  case 'chip':{
   const q=d.q,o=d.opt;
   if(d.multi==='1'){const arr=S.clarifyAnswers[q]||[];const i=arr.indexOf(o);if(i>=0)arr.splice(i,1);else arr.push(o);S.clarifyAnswers[q]=arr;}
   else S.clarifyAnswers[q]=o;
   render();break;}
  case 'clarify-submit':case 'clarify-skip':{
   const m=S.messages.filter(x=>x.kind==='clarify').pop();if(m)m.done=true;
   const ans=S.clarifyAnswers;
   const parts=[];if(ans.q2)parts.push('Direction: '+ans.q2);if(ans.q3&&ans.q3.length)parts.push('Includes: '+ans.q3.join(', '));if(ans.q4)parts.push('Audience: '+ans.q4);if(ans.q1)parts.push('Goal: '+ans.q1);
   pushMsg({id:uid(),role:'user',text:d.act==='clarify-skip'?'Use smart defaults for anything I skipped.':(parts.join(' · ')||'Looks good — proceed.')});
   S.pipeline.waiting=null;resolveGate(ans);render();break;}
  case 'design-approve':{const m=S.messages.find(x=>x.id===d.mid);S.pipeline.waiting=null;resolveGate('approve');break;}
  case 'design-regen':{S.pipeline.waiting=null;resolveGate('regen');break;}
  case 'roadmap-approve':{S.pipeline.waiting=null;resolveGate(true);break;}
  case 'repair-approve':{const m=S.messages.find(x=>x.id===d.mid);S.pipeline.waiting=null;resolveGate(true);break;}
  case 'drawer-open':S.drawer=true;renderDrawer();break;
  case 'drawer-close':S.drawer=false;renderDrawer();break;
  case 'folder':S.openFolders[d.d]=S.openFolders[d.d]===false?true:false;render();break;
  case 'file':S.selFile=d.path;render();break;
  case 'pv-refresh':wirePreview();toast('Preview refreshed','info');break;
  case 'pv-open':{if(!S.previewOn){toast('Preview is not ready yet.','warn');break;}
   const b=new Blob([previewDoc(S.project)],{type:'text/html'});window.open(URL.createObjectURL(b),'_blank');break;}
  case 'pv-device':{const fr=$('#pvFrame');if(fr){fr.style.width=d.w==='375'?'375px':'100%';}break;}
  case 'tl':S.expanded[d.id]=!S.expanded[d.id];render();break;
  case 'tok-row':S.expanded['t'+d.id]=!S.expanded['t'+d.id];render();break;
  case 'gw-test':testGateway();break;
  case 'toggle':S.settings.autonomy[d.k]=!S.settings.autonomy[d.k];save();render();toast('Autonomy setting updated','info');break;
  case 'export':{download((S.project?S.project.name.toLowerCase().replace(/\s+/g,'-'):'meridian')+'-project.json',JSON.stringify({project:S.project,roadmap:S.roadmap,timeline:S.timeline,telemetry:S.telemetry},null,2));toast('Project exported as JSON','success');break;}
  case 'delete-project':{modal({title:'Delete project?',body:'This removes the current project, its roadmap and timeline from the workspace. Telemetry and settings are kept.',
   actions:[{label:'Cancel',act:'modal-x'},{label:'Delete',cls:'btn-danger',act:'confirm-del'}]});break;}
  case 'confirm-del':{S.project=null;S.roadmap=[];S.timeline=[];S.previewOn=false;S.terminal=[];S.selFile=null;closeModal();save();render();toast('Project deleted','info');break;}
  case 'reset-all':{modal({title:'Reset workspace?',body:'This clears the project, timeline, telemetry and all session data. Settings are preserved.',
   actions:[{label:'Cancel',act:'modal-x'},{label:'Reset everything',cls:'btn-danger',act:'confirm-reset'}]});break;}
  case 'confirm-reset':{try{localStorage.removeItem(LS);}catch(e){}
   S.project=null;S.roadmap=[];S.timeline=[];S.telemetry=[];S.previewOn=false;S.terminal=[];S.activity=[];S.messages=[];S.selFile=null;closeModal();greet();render();toast('Workspace reset','info');break;}
  case 'memory':{if(!S.project)break;const b=S.project.brief,tk=resolveTokens(S.project.design);
   modal({title:'Project memory — '+esc(S.project.name),body:`
    <div class="space-y-3">
     <div><div class="lbl mb-1">Brief</div><div class="text-zinc-300">${esc(b.goal)} · for ${esc(b.audience)}. ${esc(b.tagline)}</div></div>
     <div><div class="lbl mb-1.5">Design tokens</div><div class="flex gap-1.5">${[['bg',tk.bg],['surface',tk.surface],['primary',tk.primary],['accent',tk.accent],['text',tk.text]].map(([l,c])=>`<div class="text-center"><div class="w-9 h-9 rounded-lg border border-white/10" style="background:${c}"></div><div class="text-[9px] text-zinc-500 mt-1">${l}</div></div>`).join('')}</div></div>
     <div><div class="lbl mb-1">Decisions</div><ul class="list-disc pl-4 text-zinc-400 space-y-1">${b.assumptions.map(a=>'<li>'+esc(a)+'</li>').join('')}<li>Multi-file structure enforced (no single-file monolith)</li><li>Roadmap executed sequentially with validation gates</li></ul></div>
     <div><div class="lbl mb-1">Features</div><div class="flex flex-wrap gap-1.5">${b.features.map(f=>'<span class="chip">'+esc(f)+'</span>').join('')}</div></div>
    </div>`});break;}
  case 'modal-x':closeModal();break;
  case 'toast-x':el.closest('.toast')?.remove();break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='composer'){const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';}
 if(e.target.id==='tokSearch'){S.tokFilter=e.target.value;const sc=e.target.selectionStart;render();const el=$('#tokSearch');if(el){el.focus();el.setSelectionRange(sc,sc);}}
 if(e.target.id==='gwUrl'){S.settings.backendUrl=e.target.value;save();}
});
document.addEventListener('change',e=>{
 if(e.target.dataset.route){S.settings.routing[e.target.dataset.route]=e.target.value;save();toast('Routing updated — '+e.target.selectedOptions[0].text,'info');}
 if(e.target.id==='tokStage'){S.tokStage=e.target.value;render();}
});
document.addEventListener('keydown',e=>{
 if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}
});

/* ═════════════════════════ INIT ═════════════════════════ */
function greet(){
 S.messages=[{id:uid(),role:'agent',kind:'text',text:"I'm Meridian — your autonomous development workspace.\n\nDescribe the product you want and I'll clarify the vision, design the system, plan the work, then build and validate it file by file. You stay in control at every gate."}];
 if(S.project)S.messages.push({id:uid(),role:'agent',kind:'text',text:`Welcome back — ${S.project.name} (${S.project.version}) is loaded from workspace memory with ${S.project.files.length} files. The preview is ready in the Workspace view, or ask me for a change.`});
}
load();
if(!S.messages.length)greet();
if(!S.selFile&&S.project&&S.project.files.length)S.selFile=S.project.files[0].path;
render();
</script>
